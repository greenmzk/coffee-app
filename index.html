<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f9c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brew Day">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="dark">
  <title>Brew Day — Coffee Recipe Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="app-icon.svg">
  <style>
    :root{
      --display-serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
      --blue:#0b4f9c;
      --blue-2:#0a478e;
      --blue-deep:#083d79;
      --blue-darker:#062f60;
      --cream:#f7f2ea;
      --cream-2:#fffaf3;
      --ink:#18334f;
      --white:#fffaf2;
      --muted:rgba(255,250,242,.69);
      --line:rgba(255,255,255,.19);
      --line-strong:rgba(255,255,255,.34);
      --glass:rgba(255,255,255,.045);
      --glass-2:rgba(255,255,255,.075);
      --shadow:0 24px 60px rgba(3,36,78,.25);
      --shadow-soft:0 12px 28px rgba(2,31,69,.16);
      --radius:22px;
      --radius-sm:13px;
      --danger:#ffddd7;
      --success:#dff7e7;
      --nav-h:76px;
      --max-w:440px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#e8edf2;color:var(--white)}
    html{-webkit-text-size-adjust:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
      min-height:100svh;display:flex;justify-content:center;align-items:stretch;
      background:
        radial-gradient(circle at 15% 7%,rgba(255,255,255,.95),transparent 31%),
        linear-gradient(135deg,#f5efe8 0%,#e8edf3 65%,#dee8f1 100%);
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    input,select,textarea{-webkit-appearance:none;appearance:none}
    [hidden]{display:none!important}

    #app{
      width:min(100%,var(--max-w));min-height:100svh;position:relative;overflow:hidden;
      background:
        radial-gradient(circle at 70% -15%,rgba(51,122,199,.35),transparent 36%),
        linear-gradient(158deg,var(--blue) 0%,var(--blue-2) 35%,var(--blue-deep) 72%,var(--blue-darker) 100%);
      box-shadow:var(--shadow);
    }
    @media(min-width:700px){
      body{padding:24px}
      #app{height:calc(100svh - 48px);min-height:620px;border-radius:34px}
    }

    .screen{
      min-height:100svh;height:100svh;display:flex;flex-direction:column;
      background:
        radial-gradient(circle at 76% 0%,rgba(59,133,211,.18),transparent 34%),
        linear-gradient(158deg,var(--blue) 0%,var(--blue-2) 35%,var(--blue-deep) 72%,var(--blue-darker) 100%);
    }
    @media(min-width:700px){.screen{min-height:100%;height:100%}}

    .scroll{overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .scroll::-webkit-scrollbar{display:none}

    .topbar{
      min-height:80px;padding:calc(13px + env(safe-area-inset-top)) 17px 10px;
      display:grid;grid-template-columns:48px 1fr 70px;align-items:end;flex:0 0 auto;
      border-bottom:1px solid transparent;background:linear-gradient(to bottom,rgba(6,47,96,.16),transparent);
    }
    .topbar.bordered{border-bottom-color:var(--line)}
    .topbar-title{
      text-align:center;font-size:17px;font-weight:780;letter-spacing:.015em;padding-bottom:7px;
    }
    .brand{
      font-family:var(--display-serif);text-align:center;font-size:26px;
      line-height:1;font-weight:700;letter-spacing:-.025em;padding-bottom:6px;
    }
    .icon-btn,.text-btn{
      min-width:42px;height:42px;border:0;background:transparent;color:var(--white);
      padding:0;display:flex;align-items:center;justify-content:center;
    }
    .icon-btn svg{width:25px;height:25px}
    .text-btn{font-size:14px;font-weight:800;justify-self:end}
    .round-btn{
      justify-self:end;width:40px;height:40px;border:0;border-radius:999px;
      background:var(--cream);color:var(--blue);font-size:28px;line-height:1;
      box-shadow:0 8px 20px rgba(0,0,0,.13);
    }

    .page-body{flex:1;min-height:0;padding:4px 16px 22px}
    .section-title{font-size:14px;font-weight:800;letter-spacing:.02em;margin:9px 0 12px}
    .eyebrow{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:800}
    .muted{color:var(--muted)}
    .mini-note{font-size:10px;line-height:1.55;color:var(--muted)}

    .bottom-nav{
      height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      display:grid;grid-template-columns:repeat(4,1fr);flex:0 0 auto;border-top:1px solid var(--line);
      background:rgba(5,44,91,.47);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    }
    .nav-btn{
      border:0;background:transparent;color:rgba(255,255,255,.61);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      font-size:9.5px;font-weight:750;padding:0;min-height:54px;
    }
    .nav-btn svg{width:23px;height:23px}
    .nav-btn.active{color:var(--cream)}
    .nav-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0}
    .nav-btn.active .nav-dot{opacity:1}

    svg.stroke{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    /* Welcome */
    .welcome{
      min-height:100%;padding:calc(25px + env(safe-area-inset-top)) 28px calc(26px + env(safe-area-inset-bottom));
      display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    }
    .brew-illustration{
      width:min(88vw,350px);
      aspect-ratio:1 / 1;
      margin:-12px 0 18px;
      border-radius:24px;
      overflow:hidden;
      background:#fff;
      box-shadow:
        0 24px 44px rgba(1,25,59,.16),
        inset 0 0 0 1px rgba(255,255,255,.72);
    }
    .brew-illustration img{
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center;
      aspect-ratio:1 / 1;
      background:#fff;
      -webkit-user-drag:none;
      user-select:none;
    }
    .welcome h1{
      font-family:var(--display-serif);font-size:49px;line-height:1;margin:8px 0 16px;
      letter-spacing:-.035em;text-shadow:0 7px 20px rgba(0,0,0,.1);
    }
    .welcome .dash{width:37px;height:2px;background:var(--cream);border-radius:999px;margin:5px auto clamp(72px,11vh,112px)}
    .primary{
      width:100%;min-height:52px;border:0;border-radius:16px;padding:0 22px;background:var(--cream);color:var(--blue-deep);
      font-weight:850;box-shadow:0 12px 28px rgba(1,28,65,.14);
    }
    .secondary{
      width:100%;min-height:48px;border:1px solid var(--line-strong);border-radius:15px;background:transparent;color:var(--white);
      font-weight:800;padding:0 18px;
    }
    .welcome .login{margin-top:19px;border:0;background:transparent;color:var(--cream);font-size:14px}

    /* Home / cards */
    .home-summary{
      display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:4px 0 18px;
    }
    .summary-chip{
      min-height:70px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);
      display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.045);
    }
    .summary-chip b{font-family:var(--display-serif);font-size:22px;font-weight:700}
    .summary-chip span{font-size:8px;letter-spacing:.14em;color:var(--muted);margin-top:4px}
    .recipe-card{
      width:100%;display:grid;grid-template-columns:57px minmax(0,1fr) 42px;min-height:105px;
      border:1px solid var(--line-strong);border-radius:13px;overflow:hidden;margin-bottom:8px;
      background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
      color:inherit;text-align:left;padding:0;box-shadow:0 9px 22px rgba(0,0,0,.055);
    }
    .date-block{
      border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:var(--display-serif);
    }
    .date-block .month{font-size:10px;opacity:.65}.date-block .day{font-size:28px;line-height:1.04}.date-block .dow{font-size:11px;margin-top:4px}
    .recipe-main{padding:13px 11px;min-width:0}
    .recipe-name{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .recipe-sub{font-size:11.5px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.91)}
    .recipe-tags{display:flex;gap:5px;align-items:center;margin-top:8px}
    .recipe-tag{font-size:8.5px;padding:4px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
    .beans{display:flex;gap:3.5px;align-items:center}
    .bean{width:11px;height:16px;border:1.4px solid currentColor;border-radius:52% 48% 48% 52%;transform:rotate(26deg);position:relative;display:inline-block}
    .bean:after{content:"";position:absolute;left:4.5px;top:1px;width:1px;height:11px;background:currentColor;border-radius:50%;transform:rotate(13deg)}
    .bean.off{opacity:.19}
    .recipe-tool{display:flex;align-items:center;justify-content:center}
    .dripper-icon{width:27px;height:28px;position:relative}
    .dripper-icon:before{content:"";position:absolute;left:3px;right:3px;top:2px;height:16px;border:2px solid currentColor;border-top-width:1px;clip-path:polygon(0 0,100% 0,72% 100%,28% 100%)}
    .dripper-icon:after{content:"";position:absolute;left:8px;right:8px;bottom:3px;height:2px;background:currentColor;box-shadow:0 -6px 0 currentColor;border-radius:2px}
    .view-all{width:100%;border:0;background:transparent;color:var(--cream);font-size:13px;font-weight:800;padding:15px 5px 10px;text-align:right}
    .empty{
      border:1px dashed var(--line-strong);border-radius:16px;padding:28px 18px;text-align:center;color:var(--muted);
      background:rgba(255,255,255,.018);font-size:12px;line-height:1.65;
    }
    .empty strong{display:block;color:var(--white);margin-bottom:5px;font-size:14px}

    /* Forms */
    .form-section{border-bottom:1px solid var(--line);padding:0 0 2px}
    .form-section:last-child{border-bottom:0}
    .form-row{
      min-height:58px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 2px;
    }
    .form-row.tall{align-items:start;padding-top:13px;padding-bottom:13px}
    .form-icon{display:flex;align-items:center;justify-content:center;color:var(--cream)}
    .form-icon svg{width:21px;height:21px}
    .form-label{font-size:13.5px;font-weight:800;line-height:1.4}
    .form-value{font-size:12px;text-align:right;color:var(--cream);max-width:184px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .field-stack{display:flex;flex-direction:column;gap:3px;min-width:0}
    .subline{font-size:10px;color:var(--muted);font-weight:500;line-height:1.35}
    .chev{font-size:24px;font-weight:200;line-height:1;padding-left:4px;opacity:.8}
    .row-btn{border:0;background:transparent;color:inherit;padding:0;display:contents}

    .text-input,.select-input,.textarea,.inline-input{
      width:100%;border:1px solid var(--line-strong);background:rgba(255,255,255,.052);color:var(--white);
      border-radius:10px;outline:none;transition:border-color .15s,background .15s,box-shadow .15s;
    }
    .text-input:focus,.select-input:focus,.textarea:focus,.inline-input:focus{
      border-color:rgba(255,255,255,.64);background:rgba(255,255,255,.075);box-shadow:0 0 0 3px rgba(255,255,255,.055);
    }
    .text-input,.select-input{height:44px;padding:0 12px}
    .inline-input{height:38px;padding:0 10px;text-align:right;max-width:148px}
    .textarea{min-height:118px;padding:12px;resize:vertical;line-height:1.7}
    .text-input::placeholder,.textarea::placeholder,.inline-input::placeholder{color:rgba(255,255,255,.38)}
    .select-input option{color:#17324d;background:white}

    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 14px}
    .field-card{
      border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.025);
    }
    .field-card label{display:block;font-size:9.5px;color:var(--muted);margin-bottom:7px;letter-spacing:.03em}
    .field-card .text-input{height:39px}

    .segmented{
      display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);
      background:rgba(3,37,79,.27);border-radius:14px;margin:10px 0 12px;
    }
    .segment{
      min-height:42px;border:0;border-radius:10px;background:transparent;color:var(--muted);
      font-weight:820;font-size:12px;letter-spacing:.02em;
    }
    .segment.active{background:var(--cream);color:var(--blue-deep);box-shadow:0 7px 15px rgba(0,0,0,.1)}

    .pour-wrap{padding:13px 2px 16px}
    .pour-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .pour-head strong{font-size:13.5px}.pour-total{font-size:11.5px;color:var(--muted)}
    .pour-row{
      display:grid;grid-template-columns:54px 1fr 1fr 34px;gap:7px;align-items:center;min-height:49px;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .pour-label{font-size:11px;font-weight:800}
    .pour-row input{
      width:100%;height:36px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--white);
      border-radius:8px;padding:0 8px;text-align:right;outline:none;
    }
    .pour-row input::placeholder{color:rgba(255,255,255,.34)}
    .remove-pour{border:0;background:transparent;color:var(--white);font-size:20px;min-width:34px;min-height:40px}
    .add-pour{
      width:100%;height:41px;border:1px dashed var(--line-strong);background:transparent;color:var(--cream);
      border-radius:10px;margin-top:8px;font-size:12px;font-weight:800;
    }
    .unit-note{font-size:9px;color:var(--muted);text-align:right;margin-top:5px}

    .rating{display:flex;gap:7px;justify-content:flex-end}
    .rating button{border:0;background:transparent;color:var(--cream);padding:2px;opacity:.23;min-width:26px;min-height:34px}
    .rating button.on{opacity:1}
    .rating .bean{width:14px;height:19px}

    .milk-custom-wrap{padding:0 2px 12px}
    .hint-box{
      margin:8px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;
      background:rgba(255,255,255,.025);font-size:10px;color:var(--muted);line-height:1.55;
    }

    .save-bar{
      position:sticky;bottom:0;z-index:3;padding:12px 0 calc(12px + env(safe-area-inset-bottom));
      background:linear-gradient(to top,var(--blue-deep) 56%,rgba(8,61,121,.95) 72%,transparent);
    }

    /* Calendar */
    .calendar-head{display:flex;align-items:center;justify-content:space-between;padding:8px 3px 14px}
    .calendar-head h2{font-family:var(--display-serif);font-size:23px;margin:0;letter-spacing:-.02em}
    .calendar-head button{border:0;background:transparent;color:var(--cream);font-size:25px;min-width:44px;min-height:44px}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
    .cal-dow{text-align:center;font-size:9px;color:var(--muted);padding:5px 0 7px}
    .cal-day{
      aspect-ratio:1/1;border:1px solid transparent;background:transparent;color:var(--cream);border-radius:10px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;
    }
    .cal-day.out{opacity:.24}.cal-day.today{border-color:var(--line-strong)}.cal-day.has{background:rgba(255,255,255,.06)}
    .cal-day.selected{background:var(--cream);color:var(--blue-deep)}
    .cal-bean{
      width:7px;height:10px;border:1.3px solid currentColor;border-radius:52% 48% 48% 52%;
      transform:rotate(27deg);position:relative;display:block;margin-top:-1px;
    }
    .cal-bean:after{
      content:"";position:absolute;left:2.7px;top:.7px;width:1px;height:6.8px;
      background:currentColor;border-radius:50%;transform:rotate(13deg);
    }
    .calendar-list-title{margin:20px 0 10px;font-size:12.5px;font-weight:800}

    /* Equipment */
    .tabs,.maker-tabs{display:flex;gap:7px;overflow:auto;scrollbar-width:none}
    .tabs::-webkit-scrollbar,.maker-tabs::-webkit-scrollbar{display:none}
    .tabs{padding:3px 0 10px}.maker-tabs{padding:0 0 12px}
    .tab,.maker-tab{
      flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--cream);
      border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap;
    }
    .tab{padding:8px 11px}.maker-tab{padding:7px 10px}
    .tab.active,.maker-tab.active{background:var(--cream);color:var(--blue-deep);border-color:var(--cream)}
    .search{position:relative;margin-bottom:11px}
    .search input{padding-left:38px}
    .search svg{position:absolute;left:12px;top:11px;width:20px;height:20px;color:var(--muted)}
    .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    .toolbar .secondary{min-height:43px;font-size:11px}
    .count-badge{
      display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:999px;
      background:rgba(255,255,255,.1);font-size:10px;padding:0 7px;
    }
    .maker-heading{
      display:flex;align-items:center;gap:9px;margin:18px 1px 9px;color:var(--white);
      font-family:var(--display-serif);font-size:17px;
    }
    .maker-heading:after{content:"";height:1px;flex:1;background:var(--line)}
    .gear-item{
      border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:8px;
      background:linear-gradient(135deg,rgba(255,255,255,.038),rgba(255,255,255,.018));box-shadow:0 8px 18px rgba(0,0,0,.035);
    }
    .gear-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .gear-name{font-size:12.5px;font-weight:820;line-height:1.45}
    .maker-badge,.custom-badge{
      flex:0 0 auto;font-size:8px;padding:4px 7px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;
    }
    .custom-badge{background:var(--cream);color:var(--blue-deep);border-color:var(--cream)}
    .gear-meta{font-size:10.5px;color:var(--muted);line-height:1.58;margin-top:7px}
    .sku{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .gear-actions{display:flex;justify-content:flex-end;margin-top:8px}
    .mini-danger{min-height:34px;border:1px solid rgba(255,221,215,.33);border-radius:9px;background:transparent;color:var(--danger);font-size:10px;padding:0 10px;font-weight:750}

    /* Detail / Profile */
    .detail-hero{
      padding:16px 4px 18px;border-bottom:1px solid var(--line);margin-bottom:12px;
    }
    .detail-date{font-size:10px;color:var(--muted);letter-spacing:.08em;margin-bottom:5px}
    .detail-hero h1{font-family:var(--display-serif);font-size:27px;line-height:1.22;margin:0 0 9px;letter-spacing:-.02em}
    .detail-tools{font-size:11px;color:var(--muted);line-height:1.55}
    .detail-card,.profile-card{
      border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:10px;
      background:linear-gradient(135deg,rgba(255,255,255,.042),rgba(255,255,255,.018));
      box-shadow:0 10px 24px rgba(0,0,0,.04);
    }
    .detail-card-title{
      font-family:var(--display-serif);font-size:14px;margin-bottom:10px;letter-spacing:.02em;
    }
    .detail-row{display:grid;grid-template-columns:116px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.095);font-size:11.5px;line-height:1.55}
    .detail-row:last-child{border-bottom:0}.detail-row dt{color:var(--muted)}.detail-row dd{margin:0;text-align:right;word-break:break-word}
    .pour-detail{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .pour-detail-item{border:1px solid var(--line);border-radius:10px;padding:9px}
    .pour-detail-item b{display:block;font-size:10px;margin-bottom:4px}.pour-detail-item span{font-size:11px;color:var(--muted)}

    .troubleshoot-cta{
      width:100%;margin:0 0 14px;padding:14px 15px;border-radius:16px;
      border:1px solid rgba(220,190,119,.42);
      background:
        radial-gradient(circle at 92% 0%,rgba(226,196,127,.16),transparent 38%),
        linear-gradient(145deg,rgba(255,255,255,.075),rgba(176,128,45,.04));

    .profile-card h3{margin:0 0 7px;font-size:14px}.profile-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.65}
    .button-row{display:flex;gap:8px;margin-top:13px}.button-row button{flex:1;min-height:42px;border-radius:10px;font-weight:800;font-size:11px}

    /* Modal / Sheets */

    /* Rankings */
    .ranking-intro{padding:12px 3px 16px}

      font-family:var(--display-serif);font-size:30px;line-height:1;margin:7px 0 10px;

    function fitOneLineElement(el){
      if(!el)return;

      const kind=el.dataset.fitOneLine||"ranking";
      const config={
        ranking:{max:13.2,min:4.5},
        empty:{max:12.5,min:4.5},
        language:{max:12.2,min:4.5},
        history:{max:12.8,min:4.5},
        temperature:{max:12.2,min:4.5},
        jaLanguage:{max:11.5,min:4.5},
        storage:{max:11.5,min:4.5},
        jaRanking:{max:12.8,min:4.5},
        jaTemperature:{max:11.8,min:4.5},
        backupJa:{max:11.2,min:4.5}
      }[kind]||{max:12.5,min:4.5};

      const width=Math.floor(el.clientWidth);
      if(width<=0)return;

      const setSize=size=>el.style.setProperty("font-size",size+"px","important");
      const fits=()=>{
        const previous=el.style.overflow;
        el.style.overflow="visible";
        const ok=el.scrollWidth<=width+0.5;
        el.style.overflow=previous;
        return ok;
      };

      // Start at the largest desired size. Only shrink when the line cannot fit.
      setSize(config.max);
      if(fits())return;

      let low=config.min;
      let high=config.max;
      let best=config.min;

      setSize(low);
      if(!fits()){
        // Extremely narrow viewport fallback: continue shrinking until no clipping occurs.
        let size=low;
        while(size>1.8&&!fits()){
          size-=0.10;
          setSize(size);
        }
        return;
      }

      // Binary-search the largest possible readable size for the available width.
      for(let i=0;i<20;i++){
        const mid=(low+high)/2;
        setSize(mid);
        if(fits()){
          best=mid;
          low=mid;
        }else{
          high=mid;
        }
      }
      setSize(Math.floor(best*100)/100);
    }

    function toNumberOrString(v){return v!==""&&Number.isFinite(Number(v))?Number(v):v}
    function formatDate(iso){
      if(!iso)return t("none");
      const d=new Date(iso+"T00:00:00");
      if(state.lang==="en"){
        return new Intl.DateTimeFormat("en-US",{year:"numeric",month:"short",day:"numeric"}).format(d);
      }
      return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
    }
    function formatRoastDate(iso){
      if(!iso)return "";
      const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!m)return String(iso);
      return state.lang==="en" ? `${m[2]}/${m[3]}/${m[1]}` : `${m[1]}/${m[2]}/${m[3]}`;
    }
    function parseRoastDate(value){
      const s=String(value||"").trim();
      if(!s)return "";
      let y,m,d,match;
      if((match=s.match(/^(\d{4})-(\d{2})-(\d{2})$/))){
        y=Number(match[1]);m=Number(match[2]);d=Number(match[3]);
      }else if(state.lang==="en" && (match=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))){
        m=Number(match[1]);d=Number(match[2]);y=Number(match[3]);
      }else if(state.lang==="ja" && (match=s.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})$/))){
        y=Number(match[1]);m=Number(match[2]);d=Number(match[3]);
      }else{
        return null;
      }
      const dt=new Date(y,m-1,d);
      if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return null;
      return `${String(y).padStart(4,"0")}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    }
    function shortTool(name){
      return String(name||"")
        .replace("V60透過ドリッパー","V60 ")
        .replace("ORIGAMI Dripper ","ORIGAMI ")
        .replace("ウェーブドリッパー","Kalita Wave ")
        .replace(/^april /,"April ");
    }
    function ratingHTML(n){return Array.from({length:5},(_,i)=>`<i class="bean ${i<n?"":"off"}"></i>`).join("")}
    function ratingButtons(n){
      return Array.from({length:5},(_,i)=>`<button type="button" class="${i<n?"on":""}" data-rating="${i+1}" aria-label="${escapeAttr(t("satisfactionAria",i+1))}"><i class="bean"></i></button>`).join("");
    }
    function recipeSort(a,b){
      const c=String(b.date||"").localeCompare(String(a.date||""));
      if(c)return c;
      return String(b.updatedAt||b.createdAt||b.id||"").localeCompare(String(a.updatedAt||a.createdAt||a.id||""));
    }
    function totalWater(r){return (Number(r.bloomWater)||0)+(r.pours||[]).reduce((s,p)=>s+(Number(p.water)||0),0)}
    function tempUnitSymbol(){return state.tempUnit==="F"?"°F":"°C"}
    function roundTemp(v){return Math.round(Number(v)*10)/10}
    function temperatureForDisplay(celsius){
      if(celsius===""||celsius===null||celsius===undefined)return "";
      const c=Number(celsius);
      if(!Number.isFinite(c))return celsius;
      return state.tempUnit==="F"?roundTemp(c*9/5+32):roundTemp(c);
    }
    function temperatureToCelsius(value){
      if(value===""||value===null||value===undefined)return "";
      const n=Number(value);
      if(!Number.isFinite(n))return value;
      return state.tempUnit==="F"?roundTemp((n-32)*5/9):roundTemp(n);
    }
    function formatTemperature(celsius){
      const v=temperatureForDisplay(celsius);
      return v===""?t("none"):`${v} ${tempUnitSymbol()}`;
    }

      return `<header class="topbar ${opts.bordered?"bordered":""}">${left}<div class="${opts.brand?"brand":"topbar-title"}">${escapeHTML(title)}</div>${right}</header>`;

      const extras=[...new Set(customMilks.filter(Boolean))].filter(x=>!base.includes(x));

    function buildRanking(field){
      const counts=new Map();
      state.recipes.forEach(r=>{
        let label="";
        if(field==="bean") label=String(r.beanOrigin||"").trim();
        if(field==="dripper") label=equipmentName(r.dripper);
        if(field==="filter") label=equipmentName(r.filter);
        if(field==="mill") label=equipmentName(r.mill);
        if(!label || label===t("unnamedCoffee")) return;
        counts.set(label,(counts.get(label)||0)+1);
      });
      return [...counts.entries()]
        .map(([name,count])=>({name,count}))
        .sort((a,b)=>b.count-a.count || a.name.localeCompare(b.name,state.lang==="ja"?"ja":"en"))
        .slice(0,5);
    }

      const host=document.getElementById("modalHost");if(!host||!state.modal)return;
      const cat=typeToCategory(state.modal.type),q=(state.modal.query||"").trim().toLowerCase();
      const makers=[...new Set(allEquipment().filter(x=>x.category===cat).map(x=>x.maker))].sort((a,b)=>a.localeCompare(b,"ja"));
      const items=allEquipment().filter(x=>{
        const catOk=x.category===cat;
        const makerOk=state.modal.maker==="all"||x.maker===state.modal.maker;
        const text=[x.maker,x.name,x.sku,x.size,x.compatible,x.material,localizedGearSearchText(x)].join(" ").toLowerCase();

      });
      const current=state.draft[state.modal.type];

      host.innerHTML=`<div class="modal"><div class="sheet">

      });
      host.querySelectorAll("[data-choice]").forEach(btn=>btn.addEventListener("click",()=>{
        state.draft[state.modal.type]=btn.dataset.choice;state.modal=null;renderEditor();

      host.querySelectorAll("[data-modal-maker]").forEach(btn=>btn.addEventListener("click",()=>{

        state.modal.query=e.target.value;const pos=e.target.selectionStart;drawEquipmentModal();

    }

    function saveCustomEquipmentFromForm(){
      const maker=document.getElementById("ceMaker")?.value.trim()||"";
      const category=document.getElementById("ceCategory")?.value||"ドリッパー";
      const name=document.getElementById("ceName")?.value.trim()||"";
      if(!maker)return toast(t("makerRequired"));
      if(!name)return toast(t("nameRequired"));
      const item={
        source:"custom",id:globalThis.crypto?.randomUUID?.()||("ce_"+Date.now()+"_"+Math.random().toString(16).slice(2)),
        maker,category,name,sku:document.getElementById("ceSku")?.value.trim()||"",
        size:document.getElementById("ceSize")?.value.trim()||"",
        compatible:document.getElementById("ceCompatible")?.value.trim()||"",
        material:document.getElementById("ceMaterial")?.value.trim()||""
      };
      customEquipment.push(item);saveCustomEquipment();
      const m=state.modal;
      if(m.returnToSelector&&m.selectorType){
        state.draft[m.selectorType]=equipId(item);state.modal=null;renderEditor();toast(t("gearAddedSelected"));
      }else{state.modal=null;renderGear();toast(t("gearAdded"))}
    }

    function deleteCustomEquipment(id){
      const item=customEquipment.find(x=>x.id===id);if(!item)return;
      confirmBox(t("deleteGearTitle"),t("deleteGearMessage",item.name),()=>{
        customEquipment=customEquipment.filter(x=>x.id!==id);saveCustomEquipment();
        if(state.gearMaker!=="all"&&!uniqueMakersForCategory(state.gearCategory).includes(state.gearMaker))state.gearMaker="all";
        renderGear();toast(t("gearDeleted"));
      });
    }

    function closePremiumModal(){
      const host=document.getElementById("modalHost");if(!host)return;
      const modal=host.querySelector(".premium-modal");
      if(!modal){host.innerHTML="";return}
      modal.classList.add("closing");
      window.setTimeout(()=>{if(host.querySelector(".premium-modal")===modal)host.innerHTML=""},190);
    }

    function openPremiumModal(){
      const host=document.getElementById("modalHost");if(!host)return;
      host.innerHTML=`<div class="modal premium-modal" role="dialog" aria-modal="true" aria-labelledby="premiumModalTitle">
        <div class="sheet premium-sheet">
          <div class="premium-modal-head">
            <div class="premium-brand">
              <div class="premium-logo" aria-hidden="true">✦</div>
              <div class="premium-brand-copy">
                <strong id="premiumModalTitle">${escapeHTML(t("premiumDialogTitle"))}</strong>
                <span>BREW DAY</span>
              </div>
            </div>
            <button class="premium-x" type="button" data-premium-close aria-label="${escapeAttr(t("premiumDialogClose"))}">×</button>
          </div>
          <div class="premium-modal-content">
            <div class="premium-catchcopy ${state.lang==="ja"?"ja":"en"}">${
              state.lang==="ja"
                ? `${escapeHTML(t("premiumCatchcopyLine1"))}<br>${escapeHTML(t("premiumCatchcopyLine2"))}`
                : escapeHTML(t("premiumCatchcopy"))
            }</div>
            <ul class="premium-benefits">
              <li class="premium-benefit"><span class="premium-check">✓</span><span>${escapeHTML(t("premiumBenefitAI"))}</span></li>
              <li class="premium-benefit"><span class="premium-check">✓</span><span>${escapeHTML(t("premiumBenefitAnalytics"))}</span></li>
              <li class="premium-benefit"><span class="premium-check">✓</span><span>${escapeHTML(t("premiumBenefitCustom"))}</span></li>
              <li class="premium-benefit"><span class="premium-check">✓</span><span>${escapeHTML(t("premiumBenefitAds"))}</span></li>
            </ul>
            <button class="premium-plan-primary" type="button" data-premium-plan="monthly">${escapeHTML(t("premiumMonthly"))}</button>
            <button class="premium-plan-secondary" type="button" data-premium-plan="yearly">
              <span>${escapeHTML(t("premiumYearly"))}</span>
              <span class="annual-badge">${escapeHTML(t("premiumAnnualBadge"))}</span>
            </button>
            <button class="premium-restore" type="button" data-premium-restore>${escapeHTML(t("premiumRestore"))}</button>
          </div>
        </div>
      </div>`;

      host.querySelector("[data-premium-close]")?.addEventListener("click",closePremiumModal);
      host.querySelector(".premium-modal")?.addEventListener("click",e=>{if(e.target===e.currentTarget)closePremiumModal()});
      host.querySelectorAll("[data-premium-plan]").forEach(btn=>btn.addEventListener("click",()=>{
        toast(t("premiumPurchaseDemo"));
      }));
      host.querySelector("[data-premium-restore]")?.addEventListener("click",()=>{
        toast(t("premiumRestoreDemo"));
      });
    }

    function requirePremium(onAllowed){
      if(state.isPremium){
        if(typeof onAllowed==="function")onAllowed();
        return true;
      }
      openPremiumModal();
      return false;
    }

    function troubleshootAdvice(issue){
      const map={
        bitter:"troubleshootAdviceBitter",
        sour:"troubleshootAdviceSour",
        weak:"troubleshootAdviceWeak",
        strong:"troubleshootAdviceStrong",
        astringent:"troubleshootAdviceAstringent"
      };
      return t(map[issue]||"troubleshootPickIssue");
    }

    function openTroubleshootModal(recipeId){
      const r=state.recipes.find(x=>x.id===recipeId);if(!r)return;
      const host=document.getElementById("modalHost");if(!host)return;
      const dr=equipmentItem(r.dripper);
      const total=totalWater(r);
      const recipeMeta=[
        `${num(r.beanWeight)} g`,
        `${total} g`,
        formatTemperature(r.waterTemp),
        dr?localizeGearName(dr.name):t("unselected")
      ].join(" · ");

      host.innerHTML=`<div class="modal trouble-modal" role="dialog" aria-modal="true" aria-labelledby="troubleTitle">
        <div class="trouble-sheet">
          <div class="trouble-head">
            <div class="trouble-brand">
              <div class="trouble-icon" aria-hidden="true">🤖</div>
              <div>
                <strong id="troubleTitle">${escapeHTML(t("troubleshootTitle"))}</strong>
                <span>BREW DAY PLUS</span>
              </div>
            </div>
            <button class="trouble-close" type="button" data-trouble-close aria-label="${escapeAttr(t("troubleshootClose"))}">×</button>
          </div>
          <div class="trouble-body">
            <p class="trouble-intro">${escapeHTML(t("troubleshootIntro"))}</p>
            <div class="trouble-recipe-card">
              <span>${escapeHTML(t("troubleshootRecipe"))}</span>
              <strong>${escapeHTML(r.beanOrigin||t("unnamedCoffee"))}</strong>
              <small>${escapeHTML(recipeMeta)}</small>
            </div>
            <div class="trouble-question">${escapeHTML(t("troubleshootQuestion"))}</div>
            <div class="trouble-issues">
              <button class="trouble-issue" type="button" data-trouble-issue="bitter">${escapeHTML(t("troubleshootBitter"))}</button>
              <button class="trouble-issue" type="button" data-trouble-issue="sour">${escapeHTML(t("troubleshootSour"))}</button>
              <button class="trouble-issue" type="button" data-trouble-issue="weak">${escapeHTML(t("troubleshootWeak"))}</button>
              <button class="trouble-issue" type="button" data-trouble-issue="strong">${escapeHTML(t("troubleshootStrong"))}</button>
              <button class="trouble-issue" type="button" data-trouble-issue="astringent">${escapeHTML(t("troubleshootAstringent"))}</button>
            </div>
            <div class="trouble-advice">
              <span>${escapeHTML(t("troubleshootAdviceTitle"))}</span>
              <p id="troubleAdvice">${escapeHTML(t("troubleshootPickIssue"))}</p>
            </div>
            <button class="trouble-done" type="button" data-trouble-close>${escapeHTML(t("troubleshootClose"))}</button>
          </div>
        </div>
      </div>`;

      const close=()=>{host.innerHTML=""};
      host.querySelectorAll("[data-trouble-close]").forEach(btn=>btn.addEventListener("click",close));
      host.querySelector(".trouble-modal")?.addEventListener("click",e=>{if(e.target===e.currentTarget)close()});
      host.querySelectorAll("[data-trouble-issue]").forEach(btn=>btn.addEventListener("click",()=>{
        host.querySelectorAll("[data-trouble-issue]").forEach(x=>x.classList.remove("active"));
        btn.classList.add("active");
        const advice=host.querySelector("#troubleAdvice");
        if(advice)advice.textContent=troubleshootAdvice(btn.dataset.troubleIssue);
      }));
    }

    /* ---------- Date modal ---------- */
    function openDateModal(){
      const host=document.getElementById("modalHost");
      host.innerHTML=`<div class="modal"><div class="sheet" style="max-height:46%">
        <div class="sheet-handle"></div>
        <div class="sheet-head"><h3>${escapeHTML(t("chooseDate"))}</h3><button class="close-btn" data-close-date>×</button></div>
        <div class="sheet-form">
          <input class="text-input" type="date" id="datePicker" value="${escapeAttr(state.draft.date)}">
          <div class="sheet-footer"><button class="sheet-cancel" data-close-date>${escapeHTML(t("cancel"))}</button><button class="sheet-save" data-apply-date>${escapeHTML(t("useThisDate"))}</button></div>
        </div>
      </div></div>`;
      host.querySelectorAll("[data-close-date]").forEach(btn=>btn.addEventListener("click",()=>{host.innerHTML=""}));
      host.querySelector("[data-apply-date]")?.addEventListener("click",()=>{state.draft.date=document.getElementById("datePicker").value||isoToday();renderEditor()});
    }

    function confirmBox(title,message,onOk){
      const host=document.getElementById("modalHost")||app;
      host.innerHTML=`<div class="confirm"><div class="confirm-box">
        <h3>${escapeHTML(title)}</h3><p>${escapeHTML(message)}</p>
        <div class="confirm-actions"><button class="confirm-cancel" data-confirm-cancel>${escapeHTML(t("cancel"))}</button><button class="confirm-ok" data-confirm-ok>${escapeHTML(t("execute"))}</button></div>
      </div></div>`;
      host.querySelector("[data-confirm-cancel]")?.addEventListener("click",()=>{host.innerHTML=""});
      host.querySelector("[data-confirm-ok]")?.addEventListener("click",()=>{host.innerHTML="";onOk()});
    }

    /* ---------- Events ---------- */
    function bindGlobal(){
      app.querySelectorAll("[data-nav]").forEach(btn=>btn.addEventListener("click",()=>navigate(btn.dataset.nav)));
      app.querySelectorAll("[data-detail]").forEach(btn=>btn.addEventListener("click",()=>openDetail(btn.dataset.detail)));
      app.querySelectorAll("[data-equipment]").forEach(btn=>btn.addEventListener("click",()=>openEquipmentModal(btn.dataset.equipment)));
      app.querySelectorAll("[data-field]").forEach(el=>{
        el.addEventListener("input",()=>updateDraftField(el));
        el.addEventListener("change",()=>updateDraftField(el));
      });
      app.querySelectorAll("[data-roast-date]").forEach(el=>{
        el.addEventListener("change",()=>{
          const parsed=parseRoastDate(el.value);
          if(parsed===null){toast(t("invalidRoastDate"));el.value=formatRoastDate(state.draft.roastDate);return;}
          state.draft.roastDate=parsed;
          el.value=formatRoastDate(parsed);
        });
        el.addEventListener("blur",()=>{
          const parsed=parseRoastDate(el.value);
          if(parsed!==null){state.draft.roastDate=parsed;el.value=formatRoastDate(parsed);}
        });
      });
      app.querySelectorAll("[data-temp-field]").forEach(el=>{
        el.addEventListener("input",()=>updateTemperatureField(el));
        el.addEventListener("change",()=>updateTemperatureField(el));
      });
      app.querySelector("[data-bloom-water]")?.addEventListener("input",e=>{
        state.draft.bloomWater=e.target.value;
        const node=app.querySelector(".pour-total");if(node)node.textContent=`${t("total")} ${totalWater(state.draft)} g`;
      });

      app.querySelectorAll("[data-brew-style]").forEach(btn=>btn.addEventListener("click",()=>{
        syncVisibleFields();state.draft.beverageType=btn.dataset.brewStyle;
        if(state.draft.beverageType==="Hot")state.draft.iceWeight="";
        renderEditor();
      }));

      app.querySelectorAll("[data-pour-water]").forEach(el=>el.addEventListener("input",()=>{
        state.draft.pours[Number(el.dataset.pourWater)].water=el.value;
        const node=app.querySelector(".pour-total");if(node)node.textContent=`${t("total")} ${totalWater(state.draft)} g`;
      }));
      app.querySelectorAll("[data-pour-time]").forEach(el=>el.addEventListener("input",()=>{state.draft.pours[Number(el.dataset.pourTime)].time=el.value}));
      app.querySelectorAll("[data-remove-pour]").forEach(btn=>btn.addEventListener("click",()=>{
        if(state.draft.pours.length<=1)return toast(t("pourMinimum"));
        syncVisibleFields();state.draft.pours.splice(Number(btn.dataset.removePour),1);renderEditor();
      }));

      app.querySelectorAll("[data-rating]").forEach(btn=>btn.addEventListener("click",()=>{
        syncVisibleFields();state.draft.rating=Number(btn.dataset.rating);renderEditor();
      }));

      app.querySelector("[data-milk-select]")?.addEventListener("change",e=>{
        state.draft.milk=e.target.value;if(state.draft.milk!=="__custom__")state.draft.customMilk="";renderEditor();
      });

      app.querySelectorAll("[data-cal]").forEach(btn=>btn.addEventListener("click",()=>{
        const c=state.calendarCursor;state.calendarCursor=new Date(c.getFullYear(),c.getMonth()+(btn.dataset.cal==="next"?1:-1),1);renderCalendar();
      }));
      app.querySelectorAll("[data-day]").forEach(btn=>btn.addEventListener("click",()=>{state.selectedCalendar=btn.dataset.day;renderCalendar()}));

      app.querySelectorAll("[data-gear-cat]").forEach(btn=>btn.addEventListener("click",()=>{
        state.gearCategory=btn.dataset.gearCat;
        if(state.gearMaker!=="all"&&!uniqueMakersForCategory(state.gearCategory).includes(state.gearMaker))state.gearMaker="all";
        renderGear();
      }));
      app.querySelectorAll("[data-gear-maker]").forEach(btn=>btn.addEventListener("click",()=>{state.gearMaker=btn.dataset.gearMaker;renderGear()}));
      app.querySelectorAll("[data-delete-custom]").forEach(btn=>btn.addEventListener("click",()=>deleteCustomEquipment(btn.dataset.deleteCustom)));

      app.querySelectorAll("[data-lang]").forEach(btn=>btn.addEventListener("click",()=>{
        const lang=btn.dataset.lang;
        if(lang!=="ja"&&lang!=="en")return;
        state.lang=lang;localStorage.setItem(LANG_KEY,lang);render();
      }));

      app.querySelectorAll("[data-temp-unit]").forEach(btn=>btn.addEventListener("click",()=>{
        const unit=btn.dataset.tempUnit;
        if(unit!=="C"&&unit!=="F")return;
        state.tempUnit=unit;localStorage.setItem(TEMP_UNIT_KEY,unit);render();
      }));

      app.querySelector("[data-premium-toggle]")?.addEventListener("click",()=>{
        state.isPremium=!state.isPremium;
        localStorage.setItem(PREMIUM_KEY,state.isPremium?"1":"0");
        render();
      });

      app.querySelectorAll("[data-premium-feature]").forEach(btn=>btn.addEventListener("click",()=>{
        openPremiumModal();
      }));

      const gearSearch=app.querySelector("#gearSearch");
      if(gearSearch)gearSearch.addEventListener("input",e=>{
        state.gearQuery=e.target.value;
        const filtered=getFilteredGear();
        app.querySelector("#gearList").innerHTML=renderGearGroups(filtered);
        app.querySelector("#gearCount").textContent=filtered.length;
        app.querySelectorAll("[data-delete-custom]").forEach(btn=>btn.addEventListener("click",()=>deleteCustomEquipment(btn.dataset.deleteCustom)));
      });

      app.querySelectorAll("[data-action]").forEach(btn=>{
        if(btn.dataset.bound)return;
        btn.dataset.bound="1";btn.addEventListener("click",()=>handleAction(btn.dataset.action));
      });

      const input=document.getElementById("importFile");
      if(input&&!input.dataset.bound){input.dataset.bound="1";input.addEventListener("change",importData)}

      fitEnglishSingleLines();
    }

    function updateDraftField(el){state.draft[el.dataset.field]=el.value}
    function updateTemperatureField(el){state.draft[el.dataset.tempField]=temperatureToCelsius(el.value)}
    function syncVisibleFields(){
      app.querySelectorAll("[data-field]").forEach(el=>{state.draft[el.dataset.field]=el.value});
      app.querySelectorAll("[data-temp-field]").forEach(el=>{state.draft[el.dataset.tempField]=temperatureToCelsius(el.value)});
      const roast=app.querySelector("[data-roast-date]");
      if(roast){
        const parsed=parseRoastDate(roast.value);
        if(parsed!==null)state.draft.roastDate=parsed;
      }
      const bloom=app.querySelector("[data-bloom-water]");if(bloom)state.draft.bloomWater=bloom.value;
    }

    function handleAction(action){
      switch(action){
        case "start":
          localStorage.setItem(WELCOME_KEY,"1");state.screen="home";render();break;
        case "new-recipe":
          state.editingId=null;state.detailId=null;state.backTarget=state.screen==="calendar"?"calendar":"home";
          state.draft=freshDraft();state.screen="editor";render();break;
        case "back":handleBack();break;
        case "save-recipe":saveRecipe();break;
        case "pick-date":openDateModal();break;
        case "add-pour":syncVisibleFields();state.draft.pours.push({water:"",time:""});renderEditor();break;
        case "edit-current":editRecipe(state.detailId);break;
        case "delete-current":deleteCurrent();break;
        case "troubleshoot-current":
          requirePremium(()=>openTroubleshootModal(state.detailId));
          break;
        case "add-custom-equipment":requirePremium(()=>openCustomEquipmentForm());break;
        case "premium":state.isPremium?toast(t("premiumFeatureUnlocked")):openPremiumModal();break;
        case "settings":
          state.settingsOrigin=state.screen==="profile"?"home":state.screen;
          state.screen="profile";render();break;
        case "export":exportData();break;
        case "import":document.getElementById("importFile")?.click();break;
        case "install-app":promptInstall();break;
        case "clear-recipes":
          confirmBox(t("deleteAllTitle"),t("deleteAllMessage"),()=>{
            state.recipes=[];saveRecipes();renderProfile();toast(t("recipesDeleted"));
          });break;
      }
    }

    function handleBack(){
      if(state.screen==="profile"){
        state.screen=state.settingsOrigin||"home";render();return;
      }
      if(state.screen==="editor"){
        state.screen=state.editingId&&state.detailId?"detail":state.backTarget||"home";render();return;
      }
      if(state.screen==="detail"){state.screen=state.backTarget||"home";render();return}
      state.screen="home";render();
    }
    function navigate(screen){
      state.screen=screen;
      if(screen==="calendar"&&state.recipes.length){
        state.selectedCalendar=[...state.recipes].sort(recipeSort)[0].date;
        const d=new Date(state.selectedCalendar+"T00:00:00");state.calendarCursor=new Date(d.getFullYear(),d.getMonth(),1);
      }
      render();
    }
    function openDetail(id){state.detailId=id;state.backTarget=state.screen==="calendar"?"calendar":"home";state.screen="detail";renderDetail()}
    function editRecipe(id){
      const r=state.recipes.find(x=>x.id===id);if(!r)return;
      state.editingId=id;state.detailId=id;state.draft=normalizeRecipe(JSON.parse(JSON.stringify(r)));
      if(!Array.isArray(state.draft.pours)||!state.draft.pours.length)state.draft.pours=[{water:"",time:""}];
      if(!state.draft.beverageType)state.draft.beverageType=Number(state.draft.iceWeight)>0?"Ice":"Hot";
      state.screen="editor";renderEditor();
    }
    function deleteCurrent(){
      const r=state.recipes.find(x=>x.id===state.detailId);if(!r)return;
      confirmBox(t("deleteRecipeTitle"),t("deleteRecipeMessage",r.beanOrigin||t("unnamedCoffee")),()=>{
        state.recipes=state.recipes.filter(x=>x.id!==state.detailId);saveRecipes();
        state.detailId=null;state.screen=state.backTarget||"home";render();toast(t("deleted"));
      });
    }

    function saveRecipe(){
      const roastInput=app.querySelector("[data-roast-date]");
      if(roastInput){
        const parsed=parseRoastDate(roastInput.value);
        if(parsed===null)return toast(t("invalidRoastDate"));
        state.draft.roastDate=parsed;
      }
      syncVisibleFields();const d=state.draft;
      if(!d.date)return toast(t("dateRequired"));
      if(!String(d.beanOrigin||"").trim())d.beanOrigin=t("unnamedCoffee");

      if(d.milk==="__custom__"){
        const name=String(d.customMilk||"").trim();if(!name)return toast(t("milkRequired"));
        if(!customMilks.includes(name)){customMilks.push(name);saveCustomMilks()}
        d.milk=name;d.customMilk="";
      }
      if(d.beverageType!=="Ice")d.iceWeight="";

      const recipe=JSON.parse(JSON.stringify(d));
      recipe.beanWeight=toNumberOrString(recipe.beanWeight);
      recipe.waterTemp=toNumberOrString(recipe.waterTemp);
      recipe.bloomWater=toNumberOrString(recipe.bloomWater);
      recipe.iceWeight=toNumberOrString(recipe.iceWeight);
      recipe.updatedAt=new Date().toISOString();

      const wasEditing=!!state.editingId;
      if(wasEditing){
        recipe.id=state.editingId;
        const idx=state.recipes.findIndex(r=>r.id===state.editingId);
        if(idx>=0){recipe.createdAt=state.recipes[idx].createdAt||recipe.updatedAt;state.recipes[idx]=recipe}
        else state.recipes.push(recipe);
      }else{
        recipe.id=globalThis.crypto?.randomUUID?.()||("r_"+Date.now()+"_"+Math.random().toString(16).slice(2));
        recipe.createdAt=new Date().toISOString();state.recipes.push(recipe);
      }
      saveRecipes();state.detailId=recipe.id;state.editingId=null;state.screen="detail";renderDetail();toast(wasEditing?t("updated"):t("saved"));
    }

    /* ---------- Backup ---------- */
    function exportData(){
      const data={app:"Brew Day",version:4,exportedAt:new Date().toISOString(),language:state.lang,temperatureUnit:state.tempUnit,recipes:state.recipes,customEquipment,customMilks};
      const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download=`brew-day-backup-${isoToday()}.json`;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t("exportDone"));
    }
    async function importData(e){
      const file=e.target.files?.[0];if(!file)return;
      try{
        const text=await file.text(),data=JSON.parse(text);
        const recipes=Array.isArray(data)?data:data.recipes;
        if(!Array.isArray(recipes))throw new Error("invalid");
        const importedCustom=Array.isArray(data.customEquipment)?data.customEquipment:[];
        const importedMilks=Array.isArray(data.customMilks)?data.customMilks:[];
        confirmBox(t("importTitle"),t("importMessage",recipes.length),()=>{
          state.recipes=recipes.map(normalizeRecipe);
          customEquipment=importedCustom.map((x,i)=>({...x,source:"custom",id:x.id||("ce_import_"+i)}));
          customMilks=[...new Set(importedMilks.filter(Boolean))];
          if(data.language==="ja"||data.language==="en"){state.lang=data.language;localStorage.setItem(LANG_KEY,state.lang)}
          if(data.temperatureUnit==="C"||data.temperatureUnit==="F"){state.tempUnit=data.temperatureUnit;localStorage.setItem(TEMP_UNIT_KEY,state.tempUnit)}
          saveRecipes();saveCustomEquipment();saveCustomMilks();renderProfile();toast(t("importDone"));
        });
      }catch(_){toast(t("importError"))}
      e.target.value="";
    }

    function toast(message){
      const el=document.getElementById("toast");if(!el)return;
      el.textContent=message;el.classList.add("show");
      clearTimeout(toast._timer);toast._timer=setTimeout(()=>el.classList.remove("show"),1750);
    }

    /* ---------- Progressive Web App ---------- */
    let deferredInstallPrompt=null;
    function isInstalledPWA(){
      return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
    }
    function promptInstall(){
      if(!deferredInstallPrompt)return toast(t("installUnavailable"));
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.finally(()=>{
        deferredInstallPrompt=null;
        if(state.screen==="profile")renderProfile();
      });
    }
    window.addEventListener("beforeinstallprompt",event=>{
      event.preventDefault();
      deferredInstallPrompt=event;
      if(state.screen==="profile")renderProfile();
    });
    window.addEventListener("appinstalled",()=>{
      deferredInstallPrompt=null;
      if(state.screen==="profile")renderProfile();
    });
    if("serviceWorker" in navigator){
      window.addEventListener("load",()=>{
        navigator.serviceWorker.register("./service-worker.js",{scope:"./"}).catch(()=>{});
      });
    }

    render();
  })();
  </script>

</body>
</html>
